# ==============================================================================
# CONFIGURACIÓN DEL SERVICIO DE CORREO ELECTRÓNICO (GMAIL SMTP SSL / CORPAC S.A.)
# ==============================================================================
# Para habilitar el envío desatendido automático a Gmail vía SMTP SSL (puerto 465):
# 1. Ingrese a: https://myaccount.google.com/apppasswords
# 2. Cree una "Contraseña de aplicación" de 16 caracteres.
# 3. Configure los campos 'smtp.remitente' y 'smtp.password' abajo:

smtp.servidor=smtp.gmail.com
smtp.puerto=465
smtp.ssl=true
smtp.nombre_remitente=CORPAC AIRWAYS S.A.
smtp.remitente=
smtp.password=
